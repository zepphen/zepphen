<text x="22" y="60" xml:space="preserve" clip-path="url(#c0)"><tspan fill="#ff2a2a">zepphen@roadrunner</tspan><tspan fill="#f2f2f2">:</tspan><tspan fill="#f2f2f2">~</tspan><tspan fill="#f2f2f2">$ </tspan><tspan fill="#f2f2f2">man aaban</tspan></text>
<text x="22" y="81" xml:space="preserve" clip-path="url(#c1)"><tspan fill="#f2f2f2"></tspan></text>
<text x="22" y="102" xml:space="preserve" clip-path="url(#c2)"><tspan fill="#f2f2f2">AABAN(1)</tspan><tspan fill="#7a7a7a">                          User Manuals                          </tspan><tspan fill="#f2f2f2">AABAN(1)</tspan></text>
<text x="22" y="123" xml:space="preserve" clip-path="url(#c3)"><tspan fill="#f2f2f2"></tspan></text>
<text x="22" y="144" xml:space="preserve" clip-path="url(#c4)"><tspan fill="#ff2a2a">NAME</tspan></text>
<text x="22" y="165" xml:space="preserve" clip-path="url(#c5)"><tspan fill="#f2f2f2">    aaban — cyber operations student, hacker, engineer, leader, learner</tspan></text>
<text x="22" y="186" xml:space="preserve" clip-path="url(#c6)"><tspan fill="#f2f2f2"></tspan></text>
<text x="22" y="207" xml:space="preserve" clip-path="url(#c7)"><tspan fill="#ff2a2a">SYNOPSIS</tspan></text>
<text x="22" y="228" xml:space="preserve" clip-path="url(#c8)"><tspan fill="#f2f2f2">    aaban [--hack] [--build] [--lead] [--learn] </tspan><tspan fill="#ff2a2a">--everything</tspan></text>
<text x="22" y="249" xml:space="preserve" clip-path="url(#c9)"><tspan fill="#f2f2f2"></tspan></text>
<text x="22" y="270" xml:space="preserve" clip-path="url(#c10)"><tspan fill="#ff2a2a">DESCRIPTION</tspan></text>
<text x="22" y="291" xml:space="preserve" clip-path="url(#c11)"><tspan fill="#f2f2f2">    Fixes things to learn how they're built.</tspan></text>
<text x="22" y="312" xml:space="preserve" clip-path="url(#c12)"><tspan fill="#f2f2f2">    Builds things to learn how they break.</tspan></text>
<text x="22" y="333" xml:space="preserve" clip-path="url(#c13)"><tspan fill="#f2f2f2">    Breaks things to learn how to secure them.</tspan></text>
<text x="22" y="354" xml:space="preserve" clip-path="url(#c14)"><tspan fill="#f2f2f2"></tspan></text>
<text x="22" y="375" xml:space="preserve" clip-path="url(#c15)"><tspan fill="#ff2a2a">STRENGTHS</tspan></text>
<text x="22" y="396" xml:space="preserve" clip-path="url(#c16)"><tspan fill="#ff2a2a">    --lead     </tspan><tspan fill="#f2f2f2">Leads teams and makes things happen.</tspan></text>
<text x="22" y="417" xml:space="preserve" clip-path="url(#c17)"><tspan fill="#ff2a2a">    --learn    </tspan><tspan fill="#f2f2f2">Will learn anything, from anyone, anytime.</tspan></text>
<text x="22" y="438" xml:space="preserve" clip-path="url(#c18)"><tspan fill="#f2f2f2"></tspan></text>
<text x="22" y="459" xml:space="preserve" clip-path="url(#c19)"><tspan fill="#ff2a2a">BUGS</tspan></text>
<text x="22" y="480" xml:space="preserve" clip-path="url(#c20)"><tspan fill="#f2f2f2">    Does not know how to give up. Tries to learn everything.</tspan></text>
<text x="22" y="501" xml:space="preserve" clip-path="url(#c21)"><tspan fill="#f2f2f2">    Reported upstream; marked </tspan><tspan fill="#ff6b6b">WONTFIX</tspan><tspan fill="#f2f2f2">. These are features.</tspan></text>
<text x="22" y="522" xml:space="preserve" clip-path="url(#c22)"><tspan fill="#f2f2f2"></tspan></text>
<text x="22" y="543" xml:space="preserve" clip-path="url(#c23)"><tspan fill="#ff2a2a">SEE ALSO</tspan></text>
<text x="22" y="564" xml:space="preserve" clip-path="url(#c24)"><tspan fill="#f2f2f2">    </tspan><tspan fill="#f2f2f2">about.txt(1)</tspan><tspan fill="#f2f2f2">, </tspan><tspan fill="#f2f2f2">neofetch(1)</tspan><tspan fill="#f2f2f2">, </tspan><tspan fill="#f2f2f2">ps(1)</tspan><tspan fill="#f2f2f2">, </tspan><tspan fill="#f2f2f2">events.log(5)</tspan></text>
<text x="22" y="585" xml:space="preserve" clip-path="url(#cfin)"><tspan fill="#ff2a2a">zepphen@roadrunner</tspan><tspan fill="#f2f2f2">:</tspan><tspan fill="#f2f2f2">~</tspan><tspan fill="#f2f2f2">$ </tspan></text>
