<text x="22" y="81" xml:space="preserve" clip-path="url(#c1)"><tspan fill="#ff2a2a">⌁ </tspan><tspan fill="#f2f2f2">cybersecurity · engineering · animals · cars · motorcycles</tspan></text>
<text x="22" y="102" xml:space="preserve" clip-path="url(#c2)"><tspan fill="#ff2a2a">⌁ </tspan><tspan fill="#f2f2f2">jack of all trades: I love to do everything </tspan><tspan fill="#ff6b6b">(a.k.a. "the everything bagel")</tspan></text>
<text x="22" y="123" xml:space="preserve" clip-path="url(#c3)"><tspan fill="#ff2a2a">⌁ </tspan><tspan fill="#f2f2f2">I love being wrong about things so I can learn to do them right</tspan></text>
<text x="22" y="144" xml:space="preserve" clip-path="url(#c4)"><tspan fill="#ff2a2a">⌁ </tspan><tspan fill="#f2f2f2">leadership roles? talk to me. I'll yap for hours about my projects,</tspan></text>
<text x="22" y="165" xml:space="preserve" clip-path="url(#c5)"><tspan fill="#f2f2f2">  and I'd love to hear about yours too</tspan></text>
